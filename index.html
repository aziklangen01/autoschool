<style>
:root{
  --asphalt:#14171A;
  --asphalt-2:#1D2126;
  --concrete:#EEF0F0;
  --paper:#FFFFFF;
  --ink:#14171A;
  --steel:#5B6470;
  --steel-light:#9AA1A9;
  --route:#FFB627;
  --route-dark:#E39F17;
  --signal:#E2402E;
  --line:rgba(20,23,26,0.10);
  --line-dark:rgba(255,255,255,0.10);
  --radius-s:10px;
  --radius-m:16px;
  --container:1180px;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Manrope',system-ui,sans-serif;
  background:var(--concrete);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,.display{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  line-height:1.05;
  letter-spacing:-0.01em;
  margin:0;
}
p{margin:0;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;max-width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
ul{margin:0;padding:0;list-style:none;}

.wrap{
  max-width:var(--container);
  margin:0 auto;
  padding:0 20px;
}
@media(min-width:768px){ .wrap{padding:0 32px;} }

section{position:relative;}
.section-pad{padding:64px 0;}
@media(min-width:768px){ .section-pad{padding:96px 0;} }

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:'Manrope',sans-serif;
  font-weight:700;
  font-size:13px;
  color:var(--route-dark);
  margin-bottom:14px;
}
.eyebrow::before{
  content:"";
  width:20px;height:2px;
  background:var(--route);
  display:inline-block;
}
.on-dark .eyebrow{color:var(--route);}
.on-dark .eyebrow::before{background:var(--route);}

.section-title{
  font-size:clamp(28px,5vw,42px);
  margin-bottom:14px;
}
.section-sub{
  font-size:16px;
  color:var(--steel);
  max-width:520px;
  line-height:1.5;
}
.on-dark .section-sub{color:var(--steel-light);}

/* Buttons */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:16px 28px;
  border-radius:999px;
  font-weight:700;
  font-size:15px;
  white-space:nowrap;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.btn-primary{
  background:var(--route);
  color:var(--asphalt);
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(255,182,39,0.35);
  background:var(--route-dark);
}
.btn-primary:active{transform:translateY(0);}
.btn-ghost{
  background:transparent;
  color:var(--ink);
  border:1.5px solid var(--line);
}
.on-dark .btn-ghost{color:#fff;border-color:var(--line-dark);}
.btn-ghost:hover{border-color:var(--route);color:var(--route-dark);}
.on-dark .btn-ghost:hover{color:var(--route);}
.btn-block{width:100%;}

/* ===== Header ===== */
header{
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  background:rgba(20,23,26,0.88);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-dark);
}
.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:64px;
  color:#fff;
  gap:16px;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:20px;
  color:#fff;
  letter-spacing:0.02em;
}
.logo-mark{
  width:32px;height:32px;
  border-radius:8px;
  background:var(--route);
  color:var(--asphalt);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:17px;
}
.nav-links{
  display:none;
  gap:22px;
  font-size:13.5px;
  font-weight:600;
  color:#D7DADD;
  white-space:nowrap;
}
.nav-links a{transition:color .15s ease;}
.nav-links a:hover{color:var(--route);}
@media(min-width:920px){ .nav-links{display:flex;} }

.header-right{
  display:flex;
  align-items:center;
  gap:14px;
}
.lang-toggle{
  display:flex;
  border:1px solid var(--line-dark);
  border-radius:999px;
  padding:3px;
  font-size:12px;
  font-weight:700;
  color:#B7BBBF;
}
.lang-toggle button{
  padding:5px 11px;
  border-radius:999px;
  transition:background .15s ease, color .15s ease;
}
.lang-toggle button.active{
  background:var(--route);
  color:var(--asphalt);
}
.header-phone{
  display:none;
  font-size:13.5px;
  font-weight:600;
  color:#fff;
  white-space:nowrap;
  transition:color .15s ease;
}
.header-phone:hover{color:var(--route);}
@media(min-width:1180px){ .header-phone{display:block;} }
.header-cta{
  display:none;
  padding:10px 18px;
  font-size:13px;
}
@media(min-width:520px){ .header-cta{display:inline-flex;} }

/* ===== Hero ===== */
.hero{
  background:linear-gradient(180deg,var(--asphalt) 0%,var(--asphalt-2) 100%);
  color:#fff;
  padding-top:128px;
  padding-bottom:64px;
  position:relative;
  overflow:hidden;
}
.hero-grid{
  display:grid;
  gap:40px;
}
@media(min-width:960px){
  .hero-grid{grid-template-columns:1.05fr 0.95fr;align-items:center;gap:24px;}
}
.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(255,182,39,0.12);
  border:1px solid rgba(255,182,39,0.35);
  color:var(--route);
  font-size:13px;
  font-weight:700;
  padding:7px 14px;
  border-radius:999px;
  margin-bottom:22px;
}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--route);}
.hero h1{
  font-size:clamp(32px,5.4vw,54px);
  color:#fff;
  margin-bottom:16px;
  max-width:18ch;
}
.hero-sub{
  font-size:17px;
  color:#C8CBCF;
  max-width:46ch;
  line-height:1.55;
  margin-bottom:32px;
}
.hero-price-row{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-end;
  gap:18px 28px;
  margin-bottom:32px;
  padding-bottom:28px;
  border-bottom:1px solid var(--line-dark);
}
.hero-price-label{
  font-size:13px;
  font-weight:700;
  color:var(--steel-light);
  margin-bottom:6px;
}
.hero-price-value{
  font-family:'Oswald',sans-serif;
  font-size:clamp(40px,7vw,60px);
  color:var(--route);
  line-height:1;
}
.hero-price-detail{
  font-size:14px;
  color:#B7BBBF;
  max-width:34ch;
  line-height:1.5;
}
.hero-ctas{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
}

/* Hero SVG scene */
.hero-scene{
  position:relative;
  min-height:280px;
}
.hero-scene svg{width:100%;height:auto;}

/* ===== Advantages ===== */
.adv-grid{
  display:grid;
  gap:18px;
  margin-top:44px;
  grid-template-columns:1fr;
}
@media(min-width:640px){ .adv-grid{grid-template-columns:1fr 1fr;} }
@media(min-width:1000px){ .adv-grid{grid-template-columns:repeat(3,1fr);} }

.adv-card{
  background:var(--paper);
  border-left:3px solid var(--route);
  border-radius:4px 14px 14px 4px;
  padding:26px 24px;
  transition:transform .2s ease, box-shadow .2s ease;
}
.adv-card:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 30px rgba(20,23,26,0.08);
}
.adv-icon{
  font-size:26px;
  margin-bottom:16px;
  display:block;
}
.adv-title{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:18px;
  margin-bottom:8px;
}
.adv-text{
  font-size:14.5px;
  color:var(--steel);
  line-height:1.5;
}

/* ===== Price block ===== */
.price-section{
  background:var(--asphalt);
  color:#fff;
}
.price-card{
  background:var(--asphalt-2);
  border:1px solid var(--line-dark);
  border-radius:var(--radius-m);
  padding:36px 26px;
  margin-top:44px;
  display:grid;
  gap:32px;
}
@media(min-width:860px){
  .price-card{grid-template-columns:1fr 1fr;padding:48px;}
}
.price-big{
  font-family:'Oswald',sans-serif;
  font-size:clamp(44px,7vw,64px);
  color:var(--route);
  line-height:1;
  margin-bottom:10px;
}
.price-tag-sub{
  font-size:14px;
  color:var(--steel-light);
  margin-bottom:28px;
}
.price-list{
  display:grid;
  gap:12px;
}
.price-list li{
  display:flex;
  align-items:flex-start;
  gap:10px;
  font-size:15px;
  color:#E4E6E8;
}
.price-check{
  flex:none;
  width:20px;height:20px;
  border-radius:50%;
  background:rgba(255,182,39,0.15);
  color:var(--route);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;
  font-weight:700;
  margin-top:1px;
}
.price-cta-col{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:16px;
}
.price-cta-col .btn{width:100%;}

/* ===== Process / timeline ===== */
.process-section{background:var(--concrete);}
.timeline{
  margin-top:5
